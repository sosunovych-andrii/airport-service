name: Django CI

on:
  pull_request:
    branches:
      - "main"
      - "develop"
  push:
    branches:
      - "main"

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options:
          --health-cmd="pg_isready -U ${{ secrets.DB_USER }} -d test_db"
    env:
      DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/test_db
      DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8

      - name: Apply migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test
